name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: X.Y.Z"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

  build-linux:
    name: Build Linux
    needs: lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build RMLOC
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify build
        shell: bash
        run: |
          test -f rmloc-linux/rmloc
          test -d rmloc-linux/prompts

      - name: Package Linux build
        shell: bash
        run: |
          tar -czf rmloc-linux-amd64.tar.gz \
            -C rmloc-linux .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: rmloc-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build RMLOC
        shell: cmd
        run: build.bat

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "rmloc-windows\rmloc.exe")) {
            throw "RMLOC executable not found."
          }

          if (-not (Test-Path "rmloc-windows\prompts")) {
            throw "Prompts directory not found."
          }

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "rmloc-windows\*" `
            -DestinationPath "rmloc-windows-amd64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: rmloc-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Release

    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-24.04

    environment:
      name: release

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist

      - name: Verify release files
        shell: bash
        run: |
          echo "Release files:"
          find dist -maxdepth 2 -type f -print

          test -f dist/rmloc-linux-amd64.tar.gz
          test -f dist/rmloc-windows-amd64.zip

      - name: Generate checksums
        shell: bash
        run: |
          cd dist

          sha256sum \
            rmloc-linux-amd64.tar.gz \
            rmloc-windows-amd64.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Find previous tag
        id: previous-tag
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          PREVIOUS_TAG="$(
            git describe \
              --tags \
              --abbrev=0 \
              --match '[0-9]*.[0-9]*.[0-9]*' \
              "${CURRENT_TAG}^" \
              2>/dev/null || true
          )"

          echo "Current tag: $CURRENT_TAG"
          echo "Previous tag: $PREVIOUS_TAG"

          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous-tag.outputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          ASSETS=(
            dist/rmloc-linux-amd64.tar.gz
            dist/rmloc-windows-amd64.zip
            dist/SHA256SUMS.txt
          )

          OPTIONS=(
            --verify-tag
            --title "RMLOC $TAG"
            --generate-notes
          )

          if [ -n "$PREVIOUS_TAG" ]; then
            OPTIONS+=(
              --notes-start-tag "$PREVIOUS_TAG"
            )
          fi

          gh release create "$TAG" \
            "${ASSETS[@]}" \
            "${OPTIONS[@]}"
